apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: syfo-oppfolgingsplan-backend-alerts
  namespace: team-esyfo
  labels:
    team: team-esyfo
spec:
  groups:
    - name: syfo-oppfolgingsplan-backend
      rules:
        - alert: SykmeldingConsumerDeserializationErrors
          expr: rate(syfo_oppfolgingsplan_backend_sykmelding_deserialization_error_total{namespace="team-esyfo"}[5m]) > 0.1
          for: 5m
          annotations:
            consequence: Kafka consumer for sykmeldingsperioder forkaster meldinger permanent. Mulig schema-endring fra teamsykmelding.
            action: "Sjekk logger for deserialization errors. Verifiser at SendtSykmeldingKafkaMessage-modellen matcher topic-kontrakten."
            summary: Sykmelding Kafka consumer forkaster meldinger (poison pills).
          labels:
            namespace: team-esyfo
            severity: warning
        - alert: SykmeldingConsumerRuntimeErrors
          expr: rate(syfo_oppfolgingsplan_backend_sykmelding_runtime_error_total{namespace="team-esyfo"}[5m]) > 0.05
          for: 10m
          annotations:
            consequence: Kafka consumer opplever gjentatte transiente feil (connection, commit, etc). Consumer kjører med backoff.
            action: "Sjekk logger for exceptions. Verifiser Kafka-tilkobling, database-tilgang og nettverkspolicyer."
            summary: Sykmelding Kafka consumer har transiente runtime-feil.
          labels:
            namespace: team-esyfo
            severity: warning
        - alert: OppfolgingsplanOutboxOldestDueTooOld
          expr: syfo_oppfolgingsplan_backend_outbox_oldest_due_age_seconds{namespace="team-esyfo",message_type=~"OPPFOLGINGSPLAN_.*"} > 900
          for: 10m
          annotations:
            consequence: Oppfølgingsplanvarsler til Budstikka har vært klare for levering i mer enn 15 minutter.
            action: "Sjekk outbox-loggene, Kafka/Budstikka-tilgjengelighet og failure_count på READY-rader."
            summary: Oppfølgingsplan-outboxen leverer ikke varsler raskt nok.
          labels:
            namespace: team-esyfo
            severity: warning
        - alert: OppfolgingsplanOutboxExpiredClaims
          expr: syfo_oppfolgingsplan_backend_outbox_expired_claims{namespace="team-esyfo",message_type=~"OPPFOLGINGSPLAN_.*"} > 0
          for: 10m
          annotations:
            consequence: Outbox-claims har forblitt utløpt og kan gi forsinkelse eller duplikate leveringsforsøk.
            action: "Sjekk pod-restarts, handler-timeout, Kafka-latens og lease-budsjett i outbox-loggene."
            summary: Oppfølgingsplan-outboxen har en vedvarende backlog av utløpte claims.
          labels:
            namespace: team-esyfo
            severity: warning
        - alert: OppfolgingsplanOutboxPersistentFailures
          expr: syfo_oppfolgingsplan_backend_outbox_retrying{namespace="team-esyfo",message_type=~"OPPFOLGINGSPLAN_.*"} > 0
          for: 15m
          annotations:
            consequence: Minst ett oppfølgingsplanvarsel har hatt en uløst teknisk feil i minst 15 minutter, også om meldingen for øyeblikket venter i backoff.
            action: "Sjekk outbox-loggene, Budstikka/Kafka-tilgjengelighet og failure_count på ikke-terminale rader."
            summary: Oppfølgingsplan-outboxen har et varsel med vedvarende tekniske feil.
          labels:
            namespace: team-esyfo
            severity: warning
